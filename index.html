<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121619" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Concreto & Madeira — Experiência interativa 3D." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Concreto & Madeira — 3D" />
  <meta property="og:description" content="Experiência interativa 3D com física em tempo real." />

  <title>Concreto &amp; Madeira — 3D</title>

  <link id="app-favicon" rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="modulepreload" href="https://esm.sh/three@0.170.0" />
  <link rel="modulepreload" href="https://esm.sh/@dimforge/rapier3d-compat@0.12.0" />
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/scene/controller.js" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Fullscreen 3D WebGL Canvas -->
  <canvas id="webgl-canvas" class="hidden"></canvas>

  <!-- Top Bar -->
  <header id="top-bar" class="top-bar is-hidden">
    <div class="top-actions">
      <button id="reset-camera-btn" type="button" class="icon-btn" aria-label="Restaurar Câmera" title="Restaurar Câmera">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.636 18.364A9 9 0 0019.95 13M18.364 5.636A9 9 0 004.05 11" />
        </svg>
      </button>
      <button id="mute-btn" type="button" class="icon-btn" aria-label="Alternar som" title="Alternar som">
        <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <svg id="icon-sound-off" class="hidden icon-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 3D Phase Action Bar -->
  <div id="phase-hud" class="phase-hud is-hidden">
    <div id="hud-observe" class="hud-observe-bare hidden">
      <button id="trigger-storm-btn" type="button" class="btn-primary btn-round-action" aria-label="Desencadear Tempestade" title="Desencadear Tempestade">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </button>
    </div>

    <div id="hud-rebuild" class="hud-observe-bare hidden">
      <button
        id="finish-rebuild-btn"
        type="button"
        class="btn-primary btn-round-action is-locked"
        disabled
        aria-label="Concluir reconstrução"
        title="Coloque todas as peças para prosseguir"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Left Rebuild Accordion Sidebar -->
  <aside id="rebuild-sidebar" class="rebuild-sidebar hidden" aria-label="Peças da reconstrução">
    <div class="glass-card rebuild-sidebar-card">
      <div class="rebuild-sidebar-head">
        <span class="rebuild-sidebar-label">Fundamentos</span>
        <span id="rebuild-progress-badge" class="rebuild-progress-badge">0 / 15</span>
      </div>
      <div id="rebuild-scroll-area" class="rebuild-scroll-area">
        <div id="rebuild-accordion-list" class="rebuild-accordion-list"></div>
      </div>
    </div>
  </aside>

  <!-- Left Narrative Caption & Action Button -->
  <div id="narrative-footer" class="narrative-footer is-hidden">
    <div class="glass-card narrative-card">
      <p id="narrative-quote" class="font-serif-poetic narrative-quote"></p>
      <button
        id="next-act-btn"
        type="button"
        class="btn-primary btn-round-action narrative-next-btn"
        aria-label="Abrir o que está guardado"
        title="Abrir o que está guardado"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Gate Overlay -->
  <section id="gate-overlay" class="gate-overlay" aria-label="Acesso">
    <div id="gate-play-stage" class="gate-stage">
      <button id="gate-play-btn" type="button" class="gate-play-btn" aria-label="Iniciar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 4.75a1 1 0 0 1 1.52-.85l11.5 7.25a1 1 0 0 1 0 1.7l-11.5 7.25A1 1 0 0 1 7 19.25V4.75Z" />
        </svg>
      </button>
    </div>

    <form id="gate-password-stage" class="gate-password-stage hidden" novalidate>
      <div id="gate-password-row" class="gate-password-row">
        <input
          id="gate-password-input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          class="gate-password-input"
          placeholder="Data importante"
          aria-label="Digite a data importante"
          aria-describedby="gate-error"
        />
        <button id="gate-submit-btn" type="submit" class="gate-submit-btn" aria-label="Confirmar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </button>
      </div>
      <p id="gate-error" class="gate-error hidden" role="alert"></p>
    </form>
  </section>

  <!-- Initial Notice Overlay -->
  <section id="notice-overlay" class="notice-overlay hidden" aria-label="Aviso inicial">
    <div class="notice-banner">
      <div class="notice-banner-inner">
        <span id="notice-kicker" class="notice-kicker"></span>
        <h1 id="notice-title" class="font-serif-poetic notice-title"></h1>
        <p id="notice-body" class="notice-body"></p>
        <ul id="notice-tips" class="notice-tips"></ul>
        <p id="notice-error" class="notice-error hidden" role="alert"></p>
        <button id="start-btn" type="button" class="btn-start notice-cta"></button>
      </div>
    </div>
  </section>

  <!-- Device / Viewport Notice -->
  <section id="device-overlay" class="notice-overlay device-overlay hidden" aria-label="Aviso de dispositivo">
    <div class="notice-banner">
      <div class="notice-banner-inner">
        <span id="device-kicker" class="notice-kicker"></span>
        <h1 id="device-title" class="font-serif-poetic notice-title"></h1>
        <p id="device-body" class="notice-body"></p>
      </div>
    </div>
  </section>

  <!-- Post-Storm Rebuild Prompt -->
  <section id="rebuild-prompt-overlay" class="notice-overlay hidden" aria-label="Reconstrução">
    <div class="notice-banner">
      <div class="notice-banner-inner">
        <h2 class="notice-title rebuild-prompt-title">Quer reconstruir a casa?</h2>
        <div class="rebuild-prompt-actions">
          <button id="rebuild-yes-btn" type="button" class="btn-primary rebuild-prompt-btn">SIM</button>
          <button id="rebuild-no-btn" type="button" class="btn-ghost-danger rebuild-prompt-btn">NÃO</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Act 4 Overlay: Letter, Spotify Tracks & Mystery Invite -->
  <section id="act4-overlay" class="act4-overlay hidden" aria-label="Carta aberta e convite">
    <div id="act4-card" class="warm-glass-card act4-card">
      <div id="act4-letter-step" class="act4-letter-step">
        <div class="act4-scroll-shell">
          <div id="act4-letter-scroll" class="act4-letter-scroll">
            <div id="act4-letter" class="act4-letter"></div>
            <div class="act4-letter-end">
              <button
                id="open-mystery-btn"
                type="button"
                class="btn-primary btn-round-action act4-chest-btn"
                aria-label="Abrir o que está guardado"
                title="Abrir o que está guardado"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 10V7.5A3.5 3.5 0 0 1 7.5 4h9A3.5 3.5 0 0 1 20 7.5V10" />
                  <path d="M3.5 10v7.5a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V10" />
                  <path d="M3.5 10h6.5" />
                  <path d="M14 10h6.5" />
                  <path d="M8 4.2V19.5" />
                  <path d="M16 4.2V19.5" />
                  <rect x="10" y="8.5" width="4" height="4.2" rx="1" />
                  <circle cx="12" cy="10.6" r="0.6" fill="currentColor" stroke="none" />
                </svg>
              </button>

              <button
                id="open-music-btn"
                type="button"
                class="btn-primary btn-round-action act4-chest-btn"
                aria-label="Abrir músicas no Spotify"
                title="Abrir músicas no Spotify"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 18V6l11-2v12" />
                  <circle cx="6.5" cy="18" r="2.5" />
                  <circle cx="17.5" cy="16" r="2.5" />
                </svg>
              </button>
            </div>
          </div>

          <div id="act4-scroll-progress" class="act4-scroll-progress" aria-hidden="true">
            <span id="act4-scroll-pct" class="act4-scroll-pct">0%</span>
            <div class="act4-scroll-track">
              <div id="act4-scroll-fill" class="act4-scroll-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="act4-music-step" class="act4-music-step hidden">
        <div class="act4-step-nav">
          <button
            id="back-from-music-btn"
            type="button"
            class="act4-back-btn"
            aria-label="Voltar para a carta"
            title="Voltar para a carta"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6 6-6-6 6-6" />
            </svg>
          </button>
        </div>

        <div id="music-qr-grid" class="music-carousel-stage"></div>

        <div class="music-carousel-controls">
          <button id="music-prev-btn" type="button" class="music-nav-btn" aria-label="Música anterior" title="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div id="music-dots" class="music-dots" role="tablist" aria-label="Selecionar música"></div>
          <button id="music-next-btn" type="button" class="music-nav-btn" aria-label="Próxima música" title="Próxima">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>

      <div id="act4-invite-step" class="act4-invite-step hidden">
        <div class="act4-step-nav">
          <button
            id="back-to-letter-btn"
            type="button"
            class="act4-back-btn"
            aria-label="Voltar para a carta"
            title="Voltar para a carta"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6 6-6-6 6-6" />
            </svg>
          </button>
        </div>

        <div id="mystery-section">
          <p id="mystery-desc" class="mystery-desc"></p>
          <div class="choice-grid">
            <button type="button" data-restaurant-choice="A" class="btn-primary btn-round-action choice-letter-btn" aria-label="Escolher letra A">A</button>
            <button type="button" data-restaurant-choice="M" class="btn-primary btn-round-action choice-letter-btn" aria-label="Escolher letra M">M</button>
          </div>
        </div>

        <div id="invite-reveal-section" class="invite-reveal hidden">
          <div class="reveal-header">
            <div>
              <span id="chosen-badge" class="chosen-badge"></span>
              <h3 id="restaurant-name" class="font-serif-poetic restaurant-name"></h3>
            </div>
          </div>

          <p id="invite-note" class="invite-note"></p>

          <div class="reveal-details">
            <div class="reveal-row">
              <span aria-hidden="true">📅</span>
              <span id="invite-datetime"></span>
            </div>
            <div class="reveal-row">
              <span aria-hidden="true">📍</span>
              <span id="restaurant-address"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
