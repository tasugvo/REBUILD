<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121619" />
  <meta name="description" content="Concreto & Madeira — Uma pequena metáfora interativa." />

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Concreto & Madeira" />
  <meta property="og:description" content="Uma pequena metáfora interativa feita para ser vivida do começo ao fim, com calma." />

  <title>Concreto &amp; Madeira</title>

  <link id="app-favicon" rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Dynamic Sky Background Layer -->
  <div id="sky-bg" class="sky-bg" aria-hidden="true"></div>

  <!-- Main Interactive Physics Canvas -->
  <canvas id="physics-canvas"></canvas>

  <!-- Top Bar -->
  <header id="top-bar" class="top-bar is-hidden">
    <div class="act-meta">
      <span id="act-badge" class="act-badge"></span>
      <span id="act-title-small" class="act-title-small"></span>
    </div>

    <div class="top-actions">
      <button id="mute-btn" type="button" class="mute-btn" aria-label="Alternar som">
        <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <svg id="icon-sound-off" class="hidden icon-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Floating Hint / Instruction Pill -->
  <div id="instruction-pill" class="instruction-pill is-hidden">
    <div class="glass-card instruction-pill-inner">
      <p id="instruction-text" class="instruction-text"></p>
    </div>
  </div>

  <!-- Floating Memory Toasts Container -->
  <div id="memory-layer" class="memory-layer" aria-hidden="true"></div>

  <!-- Bottom Narrative Caption & Action Button -->
  <div id="narrative-footer" class="narrative-footer is-hidden">
    <div class="glass-card narrative-card">
      <p id="narrative-quote" class="font-serif-poetic narrative-quote"></p>
      <button id="next-act-btn" type="button" class="btn-amber"></button>
    </div>
  </div>

  <!-- Gate Overlay: Step 1 (Bouncing Play Triangle) & Step 2 (Password Pill) -->
  <section id="gate-overlay" class="gate-overlay" aria-label="Acesso">
    <div id="gate-play-stage" class="gate-stage">
      <button id="gate-play-btn" type="button" class="gate-play-btn" aria-label="Iniciar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 4.75a1 1 0 0 1 1.52-.85l11.5 7.25a1 1 0 0 1 0 1.7l-11.5 7.25A1 1 0 0 1 7 19.25V4.75Z" />
        </svg>
      </button>
    </div>

    <form id="gate-password-stage" class="gate-password-stage hidden" novalidate>
      <div id="gate-password-row" class="gate-password-row">
        <input
          id="gate-password-input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          class="gate-password-input"
          placeholder="Senha"
          aria-label="Digite a senha"
        />
        <button id="gate-submit-btn" type="submit" class="gate-submit-btn" aria-label="Confirmar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </button>
      </div>
      <p id="gate-error" class="gate-error hidden" role="alert"></p>
    </form>
  </section>

  <!-- Step 3: Big Full-Screen Rectangular Banner Notice Before Act I -->
  <section id="notice-overlay" class="notice-overlay hidden" aria-label="Aviso inicial">
    <div class="notice-banner">
      <div class="notice-banner-inner">
        <span id="notice-kicker" class="notice-kicker"></span>
        <h1 id="notice-title" class="font-serif-poetic notice-title"></h1>
        <p id="notice-body" class="notice-body"></p>
        <ul id="notice-tips" class="notice-tips"></ul>
        <button id="start-btn" type="button" class="btn-start notice-cta"></button>
      </div>
    </div>
  </section>

  <!-- Device / Viewport Notice (iPhone, iPad, or < 720p) -->
  <section id="device-overlay" class="notice-overlay device-overlay hidden" aria-label="Aviso de dispositivo">
    <div class="notice-banner">
      <div class="notice-banner-inner">
        <span id="device-kicker" class="notice-kicker"></span>
        <h1 id="device-title" class="font-serif-poetic notice-title"></h1>
        <p id="device-body" class="notice-body"></p>
      </div>
    </div>
  </section>

  <!-- Act 4 Overlay: The Surprise & Mystery Invite -->
  <section id="act4-overlay" class="act4-overlay hidden" aria-label="Carta aberta e convite">
    <div id="act4-card" class="warm-glass-card act4-card">
      <span id="act4-badge" class="act4-badge"></span>

      <h2 id="act4-title" class="font-serif-poetic act4-title"></h2>

      <p id="act4-letter" class="act4-letter"></p>

      <div class="act4-divider"></div>

      <!-- Mystery Choice Section -->
      <div id="mystery-section">
        <p id="mystery-kicker" class="mystery-kicker"></p>
        <p id="mystery-desc" class="mystery-desc"></p>

        <div class="choice-grid">
          <button type="button" data-restaurant-choice="A" class="choice-btn">
            <span class="font-serif-poetic choice-letter">A</span>
            <span id="choice-label-a" class="choice-label"></span>
          </button>

          <button type="button" data-restaurant-choice="M" class="choice-btn">
            <span class="font-serif-poetic choice-letter">M</span>
            <span id="choice-label-m" class="choice-label"></span>
          </button>
        </div>
      </div>

      <!-- Revealed Invite Section -->
      <div id="invite-reveal-section" class="invite-reveal hidden">
        <div class="reveal-header">
          <div>
            <span id="chosen-badge" class="chosen-badge"></span>
            <h3 id="restaurant-name" class="font-serif-poetic restaurant-name"></h3>
          </div>
          <button type="button" id="switch-option-btn" class="switch-btn"></button>
        </div>

        <div class="reveal-details">
          <div class="reveal-row">
            <span>📅</span>
            <span id="invite-datetime"></span>
          </div>
          <div class="reveal-row">
            <span>📍</span>
            <span id="restaurant-address"></span>
          </div>
        </div>

        <div class="reveal-actions">
          <a id="gcal-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-amber">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span id="gcal-btn-label"></span>
          </a>

          <button type="button" id="download-ics-btn" class="btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span id="ics-btn-label"></span>
          </button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
